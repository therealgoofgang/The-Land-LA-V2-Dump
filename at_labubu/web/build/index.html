<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://kit-pro.fontawesome.com/releases/v6.2.0/css/pro.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuBu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index-ygug_ivX.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DWFVSbjc.css">
    <link rel="stylesheet" href="./crafting/style.css">
  </head>
  <body>
    <!-- Original shop UI mount (React) -->
    <div id="root"></div>

    <!-- Our custom crafting UI mount -->
    <div id="bubu-craft-root" class="hidden">
      <div class="bubu-sparkles" aria-hidden="true"></div>

      <div class="bubu-panel">
        <header class="bubu-panel__header">
          <div class="bubu-header-left">
            <div class="bubu-logo-dot"></div>
            <div>
              <h1 class="bubu-title">BuBu Workshop</h1>
              <p class="bubu-subtitle">pick a friend to bring to life ✿</p>
            </div>
          </div>
          <button class="bubu-close-btn" id="bubuCloseBtn" aria-label="Close">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>

        <div class="bubu-layout">
          <aside class="bubu-recipe-list" id="bubuRecipeList"></aside>
          <section class="bubu-detail" id="bubuDetail"></section>
        </div>
      </div>

      <div class="bubu-confetti" id="bubuConfetti" aria-hidden="true"></div>
    </div>

    <script src="./crafting/app.js"></script>
  </body>
</html>
