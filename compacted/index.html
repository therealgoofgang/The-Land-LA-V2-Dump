<!DOCTYPE html>
<html lang="fr">
        <head>
            <title>dwddwa</title>
            <meta charset="UTF-8">
            <meta http-equiv="X-UA-Compatible" content="IE=edge">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
        </head>
    <body>
        <div class="mainscreen">
        </div>
        <div class="timestamp">
            <div class="date"></div>
            <div class="time"></div>
        </div>
    </body>

    <script>
        const fmt = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/New_York',
            year: '2-digit',
            month: 'numeric',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            hour12: true
        });

        setInterval(function(){
            const parts = fmt.formatToParts(new Date());

            const map = Object.fromEntries(
                parts.map(p => [p.type, p.value])
            );

            const time = `${map.hour}:${map.minute}${map.dayPeriod}`;
            const date = `${map.month}.${map.day}.${map.year}`;
            const timeEl = document.querySelector('.time');
            if (timeEl) timeEl.innerText = time;
            const dateEl = document.querySelector('.date');
            if (dateEl) dateEl.innerText = date;
        }, 1000);
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-smooth: auto;
        }

        *:focus {
            outline: none;
        }

        :root {
            font-size: 62.5%;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            font-size: 1.6rem;
            overflow: hidden;
        }

        .timestamp {
            position: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            column-gap: 1px;
            right: 0.8vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            bottom: 1.4vh;
            font-size: 1.32vh;
            color: #bdbdbda4;
            padding-bottom: 10px;
        }

        .time, .date {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: none;
            padding: none;
        }

        .mainscreen {
            width: 100vw;
            height: 100vh;
            background-image: url('./filter.svg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            z-index: -10000;
        }

        
    </style>
</html>
